.grit-top-nav .nav-link{white-space:nowrap !important;flex:0 0 auto !important;max-width:none !important;min-width:0 !important;min-height:0 !important;flex-shrink:0 !important;display:inline-flex !important;align-items:center !important;justify-content:center !important;text-align:center !important;line-height:1.2 !important;padding:8px 9px !important;font-size:clamp(8.5px,1.9vw,11px) !important;letter-spacing:1px !important;}
.grit-top-nav summary.nav-link::-webkit-details-marker{display:none !important;}
.grit-top-nav summary.nav-link::marker{content:"" !important;}
.grit-nav-dropdown .nav-link{width:100% !important;justify-content:flex-start !important;}
.grit-nav-more[open] summary.nav-link{color:#FF4D00 !important;}
@media (max-width:768px){.grit-top-nav{justify-content:flex-start !important;padding-left:8px !important;padding-right:8px !important;} .grit-top-nav .nav-link{font-size:9px !important;padding:8px 7px !important;letter-spacing:.4px !important;}}
@media (max-width:390px){.grit-top-nav .nav-link{font-size:8.5px !important;padding:8px 6px !important;}}
@media (max-width:360px){.grit-top-nav .nav-link{font-size:8px !important;padding:8px 5px !important;}}

<style id="grit-minimal-athlete">.grit-athlete-top{display:grid;grid-template-columns:230px 1fr;gap:16px;align-items:start;}.grit-athlete-card select option{color:#0F0F0F;}@media (max-width:640px){.grit-athlete-top{grid-template-columns:1fr;}}.bg-layer{display:block !important;visibility:visible !important;}.bg-img{display:block !important;visibility:visible !important;opacity:0.62 !important;}.grit-coach-only{display:none !important;}body.grit-coach-on .grit-coach-only{display:block !important;}@media (max-width:768px){.grit-home-videos{display:grid !important;grid-template-columns:repeat(3,minmax(0,1fr)) !important;gap:6px !important;margin-top:26px !important;}.grit-home-videos>div{min-width:0 !important;}.grit-video-caption{font-size:9px !important;letter-spacing:0.4px !important;bottom:4px !important;padding:0 3px !important;}}.grit-coach-fab{position:fixed !important;right:14px !important;bottom:14px !important;z-index:9999 !important;width:32px !important;height:32px !important;border-radius:50% !important;background:rgba(255,255,255,0.10) !important;border:1px solid rgba(255,255,255,0.15) !important;color:rgba(255,255,255,0.45) !important;font-size:14px !important;line-height:1 !important;display:flex !important;align-items:center !important;justify-content:center !important;cursor:pointer !important;padding:0 !important;min-width:0 !important;min-height:0 !important;line-height:1 !important;display:flex !important;align-items:center !important;justify-content:center !important;cursor:pointer !important;padding:0 !important;min-width:0 !important;min-height:0 !important;}body.grit-coach-on .grit-coach-fab{background:#E0521E !important;color:#0F0F0F !important;border-color:#E0521E !important;}@media (max-width:768px){main{padding-top:0 !important;}main>div:first-child{padding-top:8px !important;}header>div>div:first-child{padding-top:6px !important;padding-bottom:2px !important;}header>div>div:nth-child(2){padding-top:0 !important;padding-bottom:6px !important;}}</style>
<style id="grit-desktop-on-mobile"> /* Fluid: no transparent-box hack - cards keep their backgrounds on all screens */ button.btn-save{border:none !important;} /* Fluid grids - auto-fit, no breakpoint jumps */ .grit-home-videos,.grit-weekly-row,.grit-this-week-row,.grit-impact-layout{width:100% !important;} </style>

<style id="grit-hero-font-white">
/* Tabs = hero slogan font, white */
.nav-link{font-family:"Space Grotesk", system-ui, sans-serif !important;font-weight:300 !important;color:#FFFFFF !important;letter-spacing:0.8px !important;}
.nav-link.active{color:#FFFFFF !important;border-bottom-color:#E0521E !important;}
.nav-link:hover{color:#FFFFFF !important;}
.grit-top-nav .nav-link{font-family:"Space Grotesk", system-ui, sans-serif !important;font-weight:300 !important;color:#FFFFFF !important;}
/* Section headings (mr) = hero font, white */
.grit-top-nav summary.nav-link{color:#FFFFFF !important;}
/* Home video captions = hero font, white */
.grit-video-caption{font-family:"Space Grotesk", system-ui, sans-serif !important;font-weight:300 !important;color:#FFFFFF !important;letter-spacing:-0.02em !important;text-shadow:0 1px 6px rgba(0,0,0,0.85) !important;}
</style>
<style id="grit-weekly-row">.grit-weekly-row{display:grid !important;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr)) !important;gap:12px !important;align-items:start !important;}</style>
<style id="grit-this-week-row">.grit-this-week-row{display:grid !important;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr)) !important;gap:12px !important;align-items:start !important;}</style>

// Coach mode detection - hide from athletes
(function(){
  try{
    if(typeof window!=="undefined"){
      if(window.location.search.includes("coach=1")||window.location.hash.includes("coach")){ /* passcode required via tiny box */ }
      // 5 taps on header enables coach mode
      let taps=0, last=0;
      document.addEventListener("click", (e)=>{
        let el=e.target;
        while(el && el!==document.body){
          if(el.textContent && el.textContent.includes("We.Are.Built")){
            let now=Date.now();
            if(now-last>2000) taps=0;
            taps++; last=now;
            if(taps>=5){ let code=window.prompt("Enter coach passcode"); if(code==="9278"){ localStorage.setItem("grit-coach-mode","1"); alert("Coach mode enabled - reload"); location.reload(); } else if(code!==null){ alert("Wrong passcode"); } taps=0; }
            break;
          }
          el=el.parentElement;
        }
      });
    }
  }catch(_){}
})();

<script>
// GRIT Supabase Sync - Cloud publishing for https://thepivotproject.github.io/TheGRIT/
(function(){
  const SHARE_BASE = 'https://thepivotproject.github.io/TheGRIT/';
  const CONFIG_KEY = 'grit-supabase-config';
  const ROSTER_KEY = 'grit-team-roster-v1';
  const CHECKINS_KEY = 'grit-checkins-v1';
  
  function getConfig(){ try { var c = JSON.parse(localStorage.getItem(CONFIG_KEY) || 'null'); if(c && c.url && c.key) return c; } catch(e){} return { url: 'https://jchbqfnpytkiaioraoqr.supabase.co', key: 'sb_publishable_AX6x9Fgb5Yh5Uo0vuDSYHQ_eyPKyOE5' }; }
  function saveConfig(url, key){
    localStorage.setItem(CONFIG_KEY, JSON.stringify({ url: url.trim(), key: key.trim() }));
  }
  function getClient(){
    const cfg = getConfig();
    if(!cfg || !cfg.url || !cfg.key) return null;
    if(!window.supabase) return null;
    try {
      // supabase-js v2 exposes createClient via window.supabase
      const createClient = window.supabase.createClient || (window.supabase.supabase && window.supabase.supabase.createClient);
      if(!createClient) return null;
      return createClient(cfg.url, cfg.key);
    } catch(e){ console.log('supabase client error', e); return null; }
  }
  
  async function publishAthlete(slug, name, data){
    const client = getClient();
    if(!client) return { ok:false, reason:'no-config' };
    const payload = {
      athlete_slug: slug,
      athlete_name: name,
      profile: data.profile || {},
      homework: data.homework || [],
      workout: data.workout || '',
      checkin: data.checkin || {},
      updated_at: new Date().toISOString(),
      is_published: true
    };
    const { error } = await client.from('grit_trainings').upsert(payload, { onConflict: 'athlete_slug' });
    if(error){ console.error(error); return { ok:false, error }; }
    return { ok:true };
  }
  
  
  async function publishRoster(roster){
     const client = getClient();
     if(!client) return { ok:false, reason:'no-config' };
     // SAFE MERGE: fetch existing so blank fields in this phone don't wipe filled-in cards
     let existingBySlug = {};
     try{
       const { data } = await client.from('grit_roster').select('athlete_slug, profile');
       (data||[]).forEach((row)=>{ existingBySlug[row.athlete_slug]=row.profile||{}; });
     }catch(e){}
     for(const r of roster){
       const slug = (r.name||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'') || r.id;
       const ex = existingBySlug[slug] || {};
       // Start from existing, only overwrite with non-blank values from this phone, always take name+pin from this phone
       const merged = { ...ex, ...r, name: r.name||ex.name||slug, pin: r.pin||ex.pin||'' };
       // If this phone has blank sport/position/etc, keep existing
       ['sport','position','impact','mantra','photo','athletePhoto','mePhoto'].forEach((k)=>{ if((r[k]===''||r[k]==null) && ex[k]!=null) merged[k]=ex[k]; });
       if((!r.metrics || Object.keys(r.metrics||{}).length===0) && ex.metrics) merged.metrics=ex.metrics;
       if(!merged.id) merged.id = r.id || ex.id;
       const payload = { athlete_slug: slug, athlete_name: merged.name||slug, profile: merged, updated_at: new Date().toISOString(), is_published: true };
       const { error } = await client.from('grit_roster').upsert(payload, { onConflict: 'athlete_slug' });
       if(error){ console.error('roster publish error', error); return { ok:false, error }; }
     }
     return { ok:true };
   }
   async function fetchRoster(){
    const client = getClient();
    if(!client) return null;
    const { data, error } = await client.from('grit_roster').select('*').order('athlete_name');
    if(error){ console.error('fetch roster error', error); return null; }
    return data || [];
  }
  async function fetchAllWithRoster(){
    const [trainings, roster] = await Promise.all([fetchAll(), fetchRoster()]);
    return { trainings, roster };
  }
  async function fetchAthlete(slug){

    const client = getClient();
    if(!client) return null;
    const { data, error } = await client.from('grit_trainings').select('*').eq('athlete_slug', slug).single();
    if(error) return null;
    return data;
  }
  
  async function fetchAll(){
    const client = getClient();
    if(!client) return null;
    const { data } = await client.from('grit_trainings').select('*').order('athlete_name');
    return data || [];
  }

  // Expose globally for app to use
  window.GRIT_SUPABASE = { getConfig, saveConfig, getClient, publishAthlete, fetchAthlete, fetchAll, publishRoster, fetchRoster, fetchAllWithRoster, SHARE_BASE };

  // Add Coach Setup UI - inject floating button
  function injectCoachUI(){
    try{ if(localStorage.getItem("grit-coach-mode")!=="1"){ /* hide from athletes unless coach mode enabled */ return; } }catch(_){}

    const btn = document.createElement('button');
    btn.id = 'grit-coach-setup-btn';
    btn.textContent = 'COACH • Tap for Supabase Setup';
    btn.style.cssText = 'position:fixed;bottom:90px;right:12px;z-index:9999;background:#FF4D00;color:#0F0F0F;border:2px solid #FF4D00;padding:10px 14px;font-family:Space Grotesk,sans-serif;font-size:11px;letter-spacing:1px;font-weight:700;text-transform:uppercase;cursor:pointer;box-shadow:0 4px 20px rgba(0,0,0,0.18);';
    btn.onclick = () => {
      let panel = document.getElementById('grit-coach-setup');
      if(panel){ panel.style.display = panel.style.display==='none'?'block':'none'; return; }
      panel = document.createElement('div');
      panel.id = 'grit-coach-setup';
      panel.style.cssText = 'position:fixed;bottom:60px;right:18px;z-index:9999;background:#0F0F0F;border:1px solid rgba(255,255,255,0.07);padding:18px;width:340px;max-width:90vw;color:#EDEBE6;font-family:Space Grotesk,sans-serif;';
      const cfg = getConfig() || { url:'', key:'' };
      panel.innerHTML = `
        <div style="font-weight:700;margin-bottom:10px;">Coach Cloud Setup - Supabase</div>
        <div style="font-size:11px;color:#8A8A8A;margin-bottom:12px;">Paste from Supabase Project > Settings > API. Enables instant publishing to https://thepivotproject.github.io/TheGRIT/#grit-training-NAME</div>
        <div style="margin-bottom:8px;"><label style="font-size:10px;letter-spacing:0.8px;">SUPABASE URL</label><input id="grit-sb-url" style="width:100%;background:#161616;border:1px solid rgba(255,255,255,0.07);color:#EDEBE6;padding:8px;font-size:12px;" placeholder="https://xyz.supabase.co" value="${cfg.url.replace(/"/g,'&quot;')}"></div>
        <div style="margin-bottom:12px;"><label style="font-size:10px;letter-spacing:0.8px;">ANON KEY</label><input id="grit-sb-key" type="password" style="width:100%;background:#161616;border:1px solid rgba(255,255,255,0.07);color:#EDEBE6;padding:8px;font-size:12px;" placeholder="eyJ..." value="${cfg.key.replace(/"/g,'&quot;')}"></div>
        <button id="grit-sb-save" style="background:#FF4D00;color:#0F0F0F;border:none;padding:10px 14px;font-weight:700;cursor:pointer;width:100%;margin-bottom:8px;">SAVE & CONNECT</button>
        <div id="grit-sb-status" style="font-size:11px;color:#8A8A8A;margin-bottom:10px;">${cfg.url?'Configured: '+cfg.url:'Not configured - using localStorage only'}</div>
        <div style="font-size:10px;color:#8A8A8A;line-height:1.5;border-top:1px solid rgba(255,255,255,0.1);padding-top:10px;">
          <div style="font-weight:700;color:#EDEBE6;margin-bottom:4px;">SQL to run once in Supabase SQL Editor:</div>
          <code style="display:block;background:#161616;padding:8px;white-space:pre-wrap;font-size:10px;">create table if not exists grit_trainings ( athlete_slug text primary key, athlete_name text, profile jsonb, homework jsonb, workout text, checkin jsonb, updated_at timestamp default now(), is_published boolean default true ); create table if not exists grit_roster ( athlete_slug text primary key, athlete_name text, profile jsonb, updated_at timestamp default now(), is_published boolean default true ); alter table grit_trainings enable row level security; alter table grit_roster enable row level security; drop policy if exists "Allow all" on grit_trainings; drop policy if exists "Allow all" on grit_roster; create policy "Allow all" on grit_trainings for all using (true) with check (true); create policy "Allow all" on grit_roster for all using (true) with check (true);</code>
          <div style="margin-top:8px;">Share base: <span style="color:#FF4D00;">https://thepivotproject.github.io/TheGRIT/</span> Example: https://thepivotproject.github.io/TheGRIT/#grit-training-cole</div>
        </div>
        <button id="grit-sb-close" style="position:absolute;top:8px;right:8px;background:transparent;border:none;color:#8A8A8A;cursor:pointer;font-size:18px;">×</button>
      `;
      document.body.appendChild(panel);
      panel.querySelector('#grit-sb-close').onclick = () => panel.style.display='none';
      panel.querySelector('#grit-sb-save').onclick = () => {
        const u = panel.querySelector('#grit-sb-url').value;
        const k = panel.querySelector('#grit-sb-key').value;
        saveConfig(u,k);
        document.getElementById('grit-sb-status').textContent = 'Saved! Reloading...';
        setTimeout(()=>location.reload(), 800);
      };
    };
    document.body.appendChild(btn);
    // Auto-show if ?coach=1 or no config and on checkin/team
    /* ?coach=1 no longer auto-opens coach setup - passcode required */
  }

  // Try to enhance existing save functions if they exist - hook into localStorage writes
  // We'll monkey-patch localStorage.setItem to detect saves and auto-publish if configured
  const origSetItem = localStorage.setItem.bind(localStorage);
  localStorage.setItem = function(k,v){
    origSetItem(k,v);
    // If saving roster or checkins, auto-publish to cloud
    try {
      if(k===ROSTER_KEY || k===CHECKINS_KEY || k.startsWith('grit-')){
        const client = getClient();
        if(!client) return;
        // Debounce
        clearTimeout(window._gritPublishTimeout);
        window._gritPublishTimeout = setTimeout(async ()=>{
          try {
            try{ let v=localStorage.getItem(k); if(v!=null) await client.from('grit_site_settings').upsert({id:k,value:v,updated_at:new Date().toISOString()},{onConflict:'id'}); }catch(_){} const roster = JSON.parse(localStorage.getItem(ROSTER_KEY) || '[]');
            const checkins = JSON.parse(localStorage.getItem(CHECKINS_KEY) || '{}');
            // Publish each
            for(const athlete of roster){
              const slug = (athlete.name || '').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
              if(!slug) continue;
              const chk = checkins[slug] || checkins[athlete.name] || {};
              await publishAthlete(slug, athlete.name, {
                profile: athlete,
                homework: chk.homework || [],
                workout: chk.workout || athlete.workout || '',
                checkin: chk.checkin || chk || {}
              });
            }
          } catch(e){ console.log('auto publish error', e); }
        }, 1500);
      }
    } catch(e){}
  };

  // On hash load for training page, try fetch from cloud
  async function tryLoadFromCloud(){
    const hash = location.hash || '';
    const m = hash.match(/#grit-training-([a-z0-9-]+)/i);
    if(!m) return;
    const slug = m[1].toLowerCase();
    const data = await fetchAthlete(slug);
    if(data){
      // Store to localStorage so existing app logic picks it up
      try {
        const checkins = JSON.parse(localStorage.getItem(CHECKINS_KEY) || '{}');
        checkins[slug] = {
          profile: data.profile,
          homework: data.homework,
          workout: data.workout,
          checkin: data.checkin,
          fromCloud: true,
          updated_at: data.updated_at
        };
        localStorage.setItem(CHECKINS_KEY, JSON.stringify(checkins));
        console.log('Loaded from cloud https://thepivotproject.github.io/TheGRIT/ for', slug, data);
        // Optional: show banner
        const banner = document.createElement('div');
        banner.textContent = `Live from coach — ${data.athlete_name} — Updated ${new Date(data.updated_at).toLocaleString()} — via https://thepivotproject.github.io/TheGRIT/`;
        banner.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:9998;background:#FF4D00;color:#0F0F0F;font-family:Space Grotesk,sans-serif;font-size:11px;letter-spacing:0.8px;text-align:center;padding:6px;';
        document.body.appendChild(banner);
        setTimeout(()=>banner.remove(), 6000);
      } catch(e){}
    }
  }

  document.addEventListener('DOMContentLoaded', ()=>{
    injectCoachUI();
    tryLoadFromCloud();
    // Also try on hash change
    window.addEventListener('hashchange', tryLoadFromCloud);
  });

})();
</script>
